openapi: 3.1.0
info:
  title: Aegis - Guard Rail Validation Framework
  description: |
    Runtime security specification for autonomous AI agent decisions.
    Evaluates every action against configurable risk dimensions, enforces
    graduated validation policies, and produces regulatory-grade audit records.

    The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT",
    "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this
    document are to be interpreted as described in RFC 2119.

    ## Extension Model

    Three extension points - Dimension Evaluators, Validators, and Resolution
    Strategies - define contracts (input/output schemas) independent of transport.
    This specification provides the HTTP/JSON binding. Implementations MAY
    support gRPC, in-process invocation, or message queues using the same schemas.

    Trust lifecycle management (tool trust state, cascade propagation, session
    enforcement) is an upstream concern outside the scope of this specification.
    Implementations MAY integrate external trust state via a registered dimension
    evaluator that maps trust levels to risk scores.

    ## Versioning

    Path-based versioning (`/v1/`). Breaking changes increment the major version.
    Non-breaking additions do not require a version bump. Clients MUST handle
    unknown fields gracefully.

    ## Authentication

    All endpoints require authentication by default (OAuth2 client credentials,
    Bearer JWT, or API key). For trusted-network deployments, operators MAY
    disable authentication at the gateway level.

    ## Rate Limiting

    Validation endpoints MUST enforce rate limiting. HTTP 429 responses
    MUST include a `Retry-After` header.

    ## Safety Invariants

    Conforming implementations MUST satisfy the following fail-safe properties:

    1. If all dimension evaluators are unreachable, treat the action as MEDIUM
       criticality (never silently allow). Note: individual dimension timeouts
       default to 0.0; this invariant applies only when ALL registered
       dimensions fail simultaneously.
    2. If all validators timeout on a HIGH/CRITICAL action, the outcome MUST be
       ESCALATED (never silently approve without consensus).
    3. If the engine encounters an internal error during evaluation, the outcome
       MUST be ESCALATED with `safety_invariant_triggered: true`.
    4. The engine MUST never produce EXECUTED for a CRITICAL action without
       receiving at least the configured minimum validator responses.
    5. READ actions MUST always receive LOW criticality regardless of other signals.

    ## Evaluation Order

    Implementations MUST evaluate in the following deterministic order. Earlier
    stages MAY short-circuit (hard deny) before later stages execute:

    1. **Action classification** - Identify action type; READ -> LOW immediately.
    2. **Dimension evaluation** - Score across all registered dimensions.
    3. **Temporal pattern check** - Detect bursts, cross-agent coordination.
    4. **Conflict detection** - Check for concurrent actions on same target.
    5. **Graduated validation** - Apply level-appropriate mechanism (bounds/consensus).
    6. **Constraint/masking evaluation** - Determine if constrained execution is viable.
    7. **Conformance logging** - Record the decision regardless of outcome.

    A BLOCKED decision at any stage MUST terminate evaluation immediately. An
    ESCALATED decision MUST hold the action and bypass subsequent stages.

    ## Request Tracing

    Include `X-Request-ID` for distributed tracing. The engine echoes or
    generates this header in all responses.

    ---
